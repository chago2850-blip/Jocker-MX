# SPDX-License-Identifier: GPL-3.0-or-later
# Compila, prueba y empaqueta Jocker-MX para Linux (.deb/.rpm), Windows (instalador .exe + .zip) y macOS (.dmg).
name: Compilación e instaladores

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Modelo de stems: se genera a partir del modelo público Spleeter 4 stems (Deezer, MIT) y se guarda en caché
  modelo:
    name: Modelo de stems (IA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: models/jx-stems-4.bin
          key: stems-${{ hashFiles('tools/export_stems_model.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exportar modelo
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -q tensorflow-cpu tf_keras numpy
          mkdir -p sp4 models
          curl -sSL https://github.com/deezer/spleeter/releases/download/v1.4.0/4stems.tar.gz | tar xz -C sp4
          TF_USE_LEGACY_KERAS=1 python tools/export_stems_model.py sp4 models/jx-stems-4.bin /tmp/referencia.json
      - uses: actions/upload-artifact@v4
        with:
          name: stems-model
          path: models/jx-stems-4.bin
          retention-days: 3

  linux:
    name: Linux (.deb y .rpm)
    needs: modelo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: stems-model, path: models }
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev libgl1-mesa-dev rpm \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-templates qml6-module-qt-labs-folderlistmodel \
            libqt6sql6-sqlite libasound2-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev pkg-config
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Pruebas
        env: { JX_STEMS_MODEL: "${{ github.workspace }}/models/jx-stems-4.bin" }
        run: ./build/jx-tests
      - name: Paquetes
        run: cd build && cpack -G "DEB;RPM"
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-linux
          path: |
            build/*.deb
            build/*.rpm

  windows:
    name: Windows (instalador)
    needs: modelo
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: stems-model, path: models }
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Compilar
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
      - name: Pruebas
        env: { JX_STEMS_MODEL: "${{ github.workspace }}/models/jx-stems-4.bin" }
        run: .\build\Release\jx-tests.exe
      - name: Paquetes
        run: |
          cd build
          cpack -G "NSIS;ZIP" -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-windows
          path: |
            build/*.exe
            build/*.zip

  macos:
    name: macOS (.dmg universal)
    needs: modelo
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: stems-model, path: models }
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build
      - name: Pruebas
        env: { JX_STEMS_MODEL: "${{ github.workspace }}/models/jx-stems-4.bin" }
        run: ./build/jx-tests
      - name: Paquete
        run: |
          cd build
          # hdiutil a veces falla con "Resource busy" en los equipos de GitHub: reintentar
          for i in 1 2 3; do cpack -G DragNDrop && break; echo "Reintento $i"; sleep 10; done
          ls *.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-macos
          path: build/*.dmg

  android:
    name: Android (APK)
    needs: modelo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: stems-model, path: models }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: all_os
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-qt683
      - name: NDK
        run: |
          NDK_VER=26.1.10909125
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VER" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VER" > /dev/null
          fi
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"
      - name: Compilar
        run: |
          sudo apt-get install -y ninja-build
          echo "QT_ROOT_DIR=$QT_ROOT_DIR  QT_HOST_PATH=${QT_HOST_PATH:-}"
          HOSTQT="${QT_HOST_PATH:-$(dirname "$QT_ROOT_DIR")/gcc_64}"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_HOST_PATH="$HOSTQT" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DJOCKER_BUILD_TESTS=OFF -DQT_ANDROID_BUILD_ALL_ABIS=OFF
          # Maven Central a veces responde 429 (demasiadas solicitudes): reintentar
          for i in 1 2 3; do cmake --build build-android --target apk && break; echo "Reintento $i"; sleep 60; done
          find build-android -name "*.apk" | head
      - name: Firmar APK
        run: |
          APK=$(find build-android -name "*-release-unsigned.apk" -o -name "*-release.apk" | head -1)
          echo "APK generado: $APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore jx.keystore -storepass jockermx -keypass jockermx -alias jockermx \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jocker-MX, O=Jocker-MX, C=MX"
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks jx.keystore --ks-pass pass:jockermx --out "jocker-mx-${GITHUB_REF_NAME//\//-}-android-arm64.apk" aligned.apk
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-android
          path: jocker-mx-*-android-arm64.apk

  release:
    name: Publicar versión
    # Se publica al subir una etiqueta v* o cuando el mensaje del commit incluye [publicar]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publicar]'))
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de la versión
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep -oP 'JOCKER_VERSION_STRING "\K[^"]+' CMakeLists.txt)
            echo "tag=v${V}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: jocker-mx-*
          path: dist
          merge-multiple: true
      - name: Lista de archivos
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Jocker-MX ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          files: dist/*
          body: |
            ## Jocker-MX ${{ steps.ver.outputs.tag }} (alfa)
            Software DJ libre (GPL-3.0-or-later). Versión de prueba: puede tener errores.

            **Novedad: separación de stems con IA** (voz, batería, bajo y melodía) ejecutada en tu equipo, con el modelo
            Spleeter de Deezer (MIT) y un motor de inferencia propio. Además: AAC/M4A, sampler, grabación, efectos,
            tonalidad Camelot, biblioteca y controladores MIDI.

            | Sistema | Archivo | Cómo instalar |
            |---|---|---|
            | **macOS 12+** (Apple Silicon e Intel) | `jocker-mx-…-Darwin.dmg` | Abre el .dmg y arrastra Jocker-MX a Aplicaciones. Aún no está notarizada: ábrela una vez y luego ve a *Ajustes del Sistema → Privacidad y seguridad → Abrir de todos modos* |
            | **Windows 10/11** (64 bits) | `jocker-mx-…-Windows.exe` (instalador) o `.zip` (portátil) | Si SmartScreen avisa, pulsa *Más información → Ejecutar de todas formas* |
            | **Ubuntu 24.04+ / Debian 13+** | `jocker-mx_…_amd64.deb` | `sudo apt install ./jocker-mx_*_amd64.deb` |
            | **Fedora 40+** | `jocker-mx-…x86_64.rpm` | `sudo dnf install ./jocker-mx-*.rpm` |
            | **Android 9+** (ARM64) | `jocker-mx-…-android-arm64.apk` | Permite instalar apps de orígenes desconocidos; mejor en tableta en horizontal. Desinstala versiones anteriores antes de instalar |

            Manual: [docs/06-MANUAL-DE-USUARIO.md](https://github.com/${{ github.repository }}/blob/main/docs/06-MANUAL-DE-USUARIO.md)
