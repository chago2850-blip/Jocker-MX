# Compila, prueba y empaqueta Jocker-MX para Linux (.deb/.rpm), Windows (instalador .exe + .zip) y macOS (.dmg).
name: Compilación e instaladores

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb y .rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev libgl1-mesa-dev rpm \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-templates qml6-module-qt-labs-folderlistmodel
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Pruebas
        run: ./build/jx-tests
      - name: Paquetes
        run: cd build && cpack -G "DEB;RPM"
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-linux
          path: |
            build/*.deb
            build/*.rpm

  windows:
    name: Windows (instalador)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Compilar
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
      - name: Pruebas
        run: .\build\Release\jx-tests.exe
      - name: Paquetes
        run: |
          cd build
          cpack -G "NSIS;ZIP" -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-windows
          path: |
            build/*.exe
            build/*.zip

  macos:
    name: macOS (.dmg universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build
      - name: Pruebas
        run: ./build/jx-tests
      - name: Paquete
        run: cd build && cpack -G DragNDrop
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-macos
          path: build/*.dmg

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          body: |
            ## Jocker-MX ${{ github.ref_name }}
            Instaladores:
            - **Windows**: `jocker-mx-…-Windows.exe` (instalador) o `.zip` (portátil)
            - **macOS** (Apple Silicon e Intel): `.dmg` — la primera vez: clic derecho sobre la app → *Abrir* (aún no está firmada)
            - **Linux**: `.deb` (Ubuntu 24.04+, Debian 13+) o `.rpm` (Fedora)
            - **Android**: en desarrollo (fase F11)
