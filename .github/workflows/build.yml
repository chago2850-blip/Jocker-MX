# SPDX-License-Identifier: GPL-3.0-or-later
# Compila, prueba y empaqueta Jocker-MX para Linux (.deb/.rpm), Windows (instalador .exe + .zip) y macOS (.dmg).
name: Compilación e instaladores

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb y .rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev libgl1-mesa-dev rpm \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-templates qml6-module-qt-labs-folderlistmodel \
            libqt6sql6-sqlite libasound2-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev pkg-config
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Pruebas
        run: ./build/jx-tests
      - name: Paquetes
        run: cd build && cpack -G "DEB;RPM"
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-linux
          path: |
            build/*.deb
            build/*.rpm

  windows:
    name: Windows (instalador)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Compilar
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
      - name: Pruebas
        run: .\build\Release\jx-tests.exe
      - name: Paquetes
        run: |
          cd build
          cpack -G "NSIS;ZIP" -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-windows
          path: |
            build/*.exe
            build/*.zip

  macos:
    name: macOS (.dmg universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build
      - name: Pruebas
        run: ./build/jx-tests
      - name: Paquete
        run: cd build && cpack -G DragNDrop
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-macos
          path: build/*.dmg

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: linux
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true
      - name: NDK
        run: |
          NDK_VER=26.1.10909125
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VER" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VER" > /dev/null
          fi
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"
      - name: Compilar
        run: |
          sudo apt-get install -y ninja-build
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DJOCKER_BUILD_TESTS=OFF -DQT_ANDROID_BUILD_ALL_ABIS=OFF
          cmake --build build-android --target apk
      - name: Firmar APK
        run: |
          APK=$(find build-android -name "*-release-unsigned.apk" -o -name "*-release.apk" | head -1)
          echo "APK generado: $APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore jx.keystore -storepass jockermx -keypass jockermx -alias jockermx \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jocker-MX, O=Jocker-MX, C=MX"
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks jx.keystore --ks-pass pass:jockermx --out "jocker-mx-${GITHUB_REF_NAME//\//-}-android-arm64.apk" aligned.apk
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jocker-mx-android
          path: jocker-mx-*-android-arm64.apk

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          body: |
            ## Jocker-MX ${{ github.ref_name }}
            Instaladores:
            - **Windows**: `jocker-mx-…-Windows.exe` (instalador) o `.zip` (portátil)
            - **macOS** (Apple Silicon e Intel): `.dmg` — arrastra Jocker-MX a Aplicaciones. Como aún no está notarizada por Apple, la primera vez ábrela y luego ve a *Ajustes del Sistema → Privacidad y seguridad → Abrir de todos modos*
            - **Linux**: `.deb` (Ubuntu 24.04+, Debian 13+) o `.rpm` (Fedora)
            - **Android** (alfa, ARM64, mejor en tableta en horizontal): `…-android-arm64.apk` — instálalo permitiendo «orígenes desconocidos»
